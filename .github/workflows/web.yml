name: web

on:
  workflow_dispatch:
  pull_request:
    paths: ["web/**", "calc-cases/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "calc-cases/**", ".github/workflows/web.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Еталони калькулятора
        run: npm test
