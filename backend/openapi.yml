        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/carts/{token}/from-estimate/{code}:
    post:
      operationId: carts_from_estimate_create
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - carts
      security:
      - customerToken: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/carts/{token}/items:
    post:
      operationId: carts_items_create
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/carts/{token}/items/{item_id}:
    patch:
      operationId: carts_items_partial_update
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
