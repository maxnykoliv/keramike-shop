      security:
      - customerToken: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout-all:
    post:
      operationId: auth_logout_all_create
      tags:
      - auth
      security:
      - customerToken: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/methods:
    get:
      operationId: auth_methods_retrieve
      tags:
