      operationId: carts_items_destroy
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - carts
      security:
      - customerToken: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/catalog/categories:
    get:
      operationId: catalog_categories_retrieve
      description: 'Дерево: slug, name, children'
      tags:
      - catalog
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/catalog/facets:
    get:
      operationId: catalog_facets_retrieve
      description: Ті самі фільтри, що й /products
      tags:
      - catalog
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/catalog/prices:
    post:
      operationId: catalog_prices_create
      description: |-
        Ціни для поточного клієнта. Каталог кешується з роздрібними цінами для всіх,
        а сайт накладає ціни майстра поверх нього цим запитом.
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricesRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricesRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricesRequestRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesResponse'
          description: ''
  /api/v1/catalog/products:
    get:
      operationId: catalog_products_list
      parameters:
      - in: query
        name: application
        schema:
          type: string
          enum:
          - floor
          - outdoor
          - wall
        description: |-
          * `wall` - Стіна
          * `floor` - Підлога
          * `outdoor` - Вулиця
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: collection
        schema:
          type: string
      - in: query
        name: color
        schema:
          type: string
      - in: query
        name: ids
        schema:
          type: array
          items:
            type: integer
        description: 'Через кому: 1,2,3'
        explode: false
        style: form
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: array
          items:
            type: string
            title: Тип
            enum:
            - accessory
            - decor
            - glue
            - grout
            - mosaic
            - primer
            - tile
            - waterproofing
        description: |-
          * `tile` - Плитка
          * `mosaic` - Мозаїка
          * `decor` - Декор
          * `glue` - Клей
          * `grout` - Затирка
          * `primer` - Ґрунтовка
          * `waterproofing` - Гідроізоляція
          * `accessory` - Аксесуар
        explode: true
        style: form
      - in: query
        name: manufacturer
        schema:
          type: string
      - in: query
        name: material
        schema:
          type: string
          title: Матеріал
          enum:
          - ceramic
          - porcelain
        description: |-
          * `ceramic` - Кераміка
          * `porcelain` - Керамограніт
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -name
            - -new
            - -price
            - name
            - new
            - price
        description: |-
          Впорядкування

          * `price` - Price
          * `-price` - Price (по спадаючій)
          * `new` - Нових
          * `-new` - Нових (по спадаючій)
          * `name` - Name
          * `-name` - Name (по спадаючій)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: integer
      - in: query
        name: price_min
        schema:
          type: integer
      - in: query
        name: room
        schema:
          type: string
          enum:
          - bathroom
          - hallway
          - kitchen
          - living
          - terrace
          - toilet
        description: |-
          * `bathroom` - Ванна
          * `toilet` - Туалет
          * `kitchen` - Кухня
          * `hallway` - Коридор
          * `terrace` - Тераса
          * `living` - Житлова кімната
      - in: query
        name: size
        schema:
          type: string
        description: Наприклад 600x600
      - in: query
        name: surface
        schema:
          type: string
      tags:
      - catalog
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductCardList'
          description: ''
  /api/v1/catalog/products/{slug}:
