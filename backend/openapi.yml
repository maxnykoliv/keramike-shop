      security:
      - customerToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/account/orders:
    get:
      operationId: account_orders_list
      description: Історія замовлень клієнта, разом із гостьовими з тим самим телефоном.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - account
      security:
      - customerToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicOrderList'
          description: ''
  /api/v1/auth/code/request:
