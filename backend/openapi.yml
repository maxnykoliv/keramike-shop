          description: ''
  /api/v1/auth/telegram/webhook:
    post:
      operationId: auth_telegram_webhook_create
      description: Викликає Telegram, не фронтенд
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/calc/config:
    get:
      operationId: calc_config_retrieve
