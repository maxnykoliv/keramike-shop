          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodeRequestRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/code/verify:
