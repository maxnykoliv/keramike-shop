                $ref: '#/components/schemas/AuthMethods'
          description: ''
  /api/v1/auth/telegram/poll:
    post:
      operationId: auth_telegram_poll_create
      description: Сайт опитує кожні 2 секунди, поки статус не confirmed або expired
      tags:
