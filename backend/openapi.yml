      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfStatus'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfStatus'
          description: ''
  /api/v1/carts/:
    post:
      operationId: carts_create
      tags:
      - carts
      security:
      - customerToken: []
      - {}
      responses:
        '201':
          content:
