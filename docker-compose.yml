# Локальна розробка: docker compose up. API на http://localhost:8000, адмінка на /admin/.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keramike
      POSTGRES_PASSWORD: keramike
      POSTGRES_DB: keramike
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keramike"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://keramike:keramike@postgres:5432/keramike
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    user: root
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: celery -A config worker -Q default,heavy -l info
    env_file: ./backend/.env
    environment: *backend-env
    volumes: ["./backend:/app"]
    user: root
    depends_on: [api]

  beat:
    build: ./backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: ./backend/.env
    environment: *backend-env
    volumes: ["./backend:/app"]
    user: root
    depends_on: [api]

volumes:
  pgdata:
